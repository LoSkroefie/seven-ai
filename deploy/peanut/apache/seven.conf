# Requires: proxy, proxy_http, headers, ssl.
# This exposes the low-authority owner gateway plus the separate HMAC-only mesh
# relay. Never proxy 127.0.0.1:18765 (Seven core API) or Ollama publicly.

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
# Discard any client-supplied chain; mod_proxy adds the real peer address.
RequestHeader unset X-Forwarded-For

RedirectMatch 302 ^/seven$ /seven/
ProxyPass        /seven-mesh/ http://127.0.0.1:18766/ nocanon retry=0 timeout=30
ProxyPassReverse /seven-mesh/ http://127.0.0.1:18766/
ProxyPass        /seven/ http://127.0.0.1:18788/ nocanon retry=0 timeout=310 flushpackets=on
ProxyPassReverse /seven/ http://127.0.0.1:18788/
ProxyPass        /3dwebsite/seven-api/ http://127.0.0.1:18788/ nocanon retry=0 timeout=310 flushpackets=on
ProxyPassReverse /3dwebsite/seven-api/ http://127.0.0.1:18788/

<Location "/seven-mesh/">
    RequestHeader unset Authorization
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Cache-Control "no-store"
</Location>

<Location "/seven/">
    RequestHeader unset Authorization
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Cache-Control "no-store"
</Location>

<Location "/3dwebsite/seven-api/">
    RequestHeader unset Authorization
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Cache-Control "no-store"
</Location>
